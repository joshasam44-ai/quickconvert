[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickconvert"
version = "0.1.0"
description = "Small, dependency-free data size conversions for Python."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "quickconvert contributors" }]
keywords = ["conversion", "data", "sizes", "units"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/your-user/quickconvert"
Repository = "https://github.com/your-user/quickconvert"
Issues = "https://github.com/your-user/quickconvert/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/quickconvert"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
